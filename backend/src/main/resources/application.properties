# ===================================================================
# QA Issue Logger - Java Spring Boot Configuration
# ===================================================================

server.port=3001

# Cloudinary Configuration
# (Enter your Cloudinary credentials below or leave empty for local fallback)
cloudinary.cloud-name=your_cloud_name
cloudinary.api-key=your_api_key
cloudinary.api-secret=your_api_secret
cloudinary.url=

# Database Configuration (H2 File-based Persistent Database)
spring.datasource.url=jdbc:h2:file:./data/qa_logger_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console (Open http://localhost:3001/h2-console during demo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Upload Limits
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB
